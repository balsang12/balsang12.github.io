name: tmp-fetch
on:
  push:
    paths: ['.github/fetch.txt']
permissions:
  contents: write
jobs:
  f:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          pip install pillow >/dev/null
          curl -sSL "$(cat .github/fetch.txt)" -o /tmp/in.img
          python3 - <<'P'
          from PIL import Image;import io,base64
          im=Image.open('/tmp/in.img').convert('RGB')
          W,H=im.size;h=round(W*3/4)
          if H>h: im=im.crop((0,(H-h)//2,W,(H-h)//2+h))
          for w in (900,800,720,640,560):
            t=im.resize((w,round(w*3/4)),Image.LANCZOS);b=io.BytesIO();t.save(b,'JPEG',quality=78,optimize=True)
            u='data:image/jpeg;base64,'+base64.b64encode(b.getvalue()).decode()
            if len(u)<=110000:break
          open('tmp_wrap.txt','w').write(u);print(w,len(u))
          P
          git config user.name bot && git config user.email bot@users.noreply.github.com
          git add tmp_wrap.txt && git commit -m "tmp image" && git push
