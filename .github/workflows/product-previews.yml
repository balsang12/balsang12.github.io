name: 상품 미리보기 갱신
on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: product-previews
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/og_pages.py p
      - run: |
          git config user.name "nongmani-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A p sitemap-products.xml sitemap.xml
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git commit -m "상품 미리보기 갱신"
          git pull --rebase -q && git push
