    if(a.buyNow&&b.amount>=a.buyNow){end=b.t;break}if(end-b.t<EXT)end=b.t+EXT}}

    tea:i=>i.cat==="말린 약초·차"||(["건조","덖음·차"].includes(form(i))&&i.cat!=="산나물")||(proc(i)&&/차/.test(form(i))),
    infuse:i=>((i.cat==="열매"||i.cat==="뿌리 약초")&&form(i)==="생물"&&i.kind==="p")||(proc(i)&&/청|잼/.test(form(i))),
    raw:i=>i.kind==="a"||i.cat==="뿌리 약초"||i.cat==="열매"||proc(i)};
  const must={wild:i=>String(i.x.grow||"").startsWith("자연산"),cert:i=>/인증/.test(i.x.grow||""),proof:i=>!!i.x.proofOk,
    review:i=>{if(i.kind!=="p")return false;const r=ctx.rating(i.x.id);return r.n>0&&r.avg>=4},season:i=>recoSeason(i.cat)};
  const fresh=i=>i.kind==="a"||form(i)==="생물";
  const mtn=i=>/^자연산/.test(i.x.grow||"")||["산양삼","장뇌삼","산삼"].includes(i.x.item||i.x.cat||"")||(i.kind==="a"&&!/재배/.test(i.x.grow||""));
  const wrapOk=i=>i.kind==="a"||!!i.x.gift;
  const regOk=i=>{const r=RECO_REG[a.region];return !r||r.some(x=>String(i.x.region||"").startsWith(x))};
  const bandHi=b=>(RECO_BAND[b]||[0,1e12])[1];
  const tries=[{},{region:1},{region:1,must:1},{region:1,must:1,budget:1},{region:1,must:1,budget:1,keep:1}];
  let out=[],relaxed={},strict=null;
  for(const r of tries){
    const hi=bud?(r.budget?bandHi(RECO_NEXT[bud]):bandHi(bud)):1e12;
    out=items.filter(i=>(!a.src||(a.src==="mtn")===mtn(i))&&(!a.how||how[a.how](i))&&i.price<=hi&&(r.keep||!a.keep||(a.keep==="fresh"?fresh(i):!fresh(i)))&&(r.region||regOk(i))&&(r.must||((a.must||[]).every(m=>must[m](i))&&(a.wrap!=="yes"||wrapOk(i)))));
    if(!strict)strict=new Set(out.map(i=>i.x.id));relaxed=r;if(out.length>=3)break}
  if(out.length===strict.size)relaxed={};
  const lo=bud?(RECO_BAND[bud]||[0])[0]:0;
  const elder=a.whoO==="parents"||a.whoG==="parents"||a.whoG==="boss",biz=a.whoO==="biz"||a.whoG==="biz";
  out.forEach(i=>{let s=0;const why=[];const it=i.x.item||i.x.cat||"";
    if(gift){if(!fresh(i)){s+=a.occ==="holiday"?3:2;why.push("keeps")}if(RECO_GIFT.includes(it)){s+=3;why.push("gift")}if(i.x.proofOk)s+=1;if(i.kind==="p"&&i.x.gift){s+=2;why.push("wrap")}}
    else if(elder){if(RECO_GIFT.includes(it))s+=1}
    if(biz&&i.kind==="p"){const g=RECO_UNIT_G[i.x.unit]||0;if(g>=1000){s+=2;why.push("bulk")}if(i.x.stock>=5)s+=1}
    if(a.whoO==="kids"&&(i.cat==="열매"||(proc(i)&&/청|잼/.test(form(i))))){s+=2;why.push("kids")}
    if(a.whoO==="family"&&i.kind==="p"){const g=RECO_UNIT_G[i.x.unit]||0;if(g>=600){s+=1;why.push("size")}}
    if(a.taste==="rare"&&(RECO_GIFT.includes(it)||String(i.x.grow||"").startsWith("자연산")||i.price>=50000)){s+=3;why.push("rare")}
    if(a.taste==="daily"&&["산나물","말린 약초·차"].includes(i.cat)){s+=2}
    if(a.taste==="new"&&!RECO_COMMON.includes(it)){s+=3;why.push("new")}
    if(a.size&&i.kind==="p"){const g=RECO_UNIT_G[i.x.unit]||0;if((a.size==="s"&&g&&g<=500)||(a.size==="m"&&g>=600&&g<=1000)||(a.size==="l"&&g>=1000)){s+=2;if(!why.includes("size"))why.push("size")}}
    if(a.prep==="easy"&&ctx.prep(it)){s-=4}
    if(ctx.prep(it))why.push("prep");
    if(i.price>=lo)s+=1;if(strict.has(i.x.id))s+=6;else why.unshift("wider");
    if(a.src)why.unshift(a.src);
    if(String(i.x.grow||"").startsWith("자연산")){s+=1;why.push("wild")}
    if(/인증/.test(i.x.grow||""))why.push("cert");
    if(i.x.proofOk){s+=1;why.push("proof")}
    if(recoSeason(i.cat)){s+=1;why.push("season")}
    if(i.kind==="p"){const r=ctx.rating(i.x.id);if(r.n){s+=r.avg/2;why.push("review")}}
    if(i.kind==="a")why.push("auction");
    i.score=s;i.why=why});
  out.sort((x,y)=>y.score-x.score||x.price-y.price);
  return {list:out.slice(0,5),relaxed,total:out.length}}

/* ---------- market ---------- */
function pcard(p){return `<button type="button" class="card" data-pid="${esc(p.id)}"><div class="thumb">${p.photo?`<img src="${esc(p.photo)}" alt="${esc(pname(p))}" loading="lazy">`:""}<div class="tl">${shipChip(p)}${String(p.grow||"").startsWith("자연산")?`<span class="chip">${esc(t("wildChip"))}</span>`:""}${p.proofOk?`<span class="chip solid">✓ ${esc(t("proof"))}</span>`:""}</div>${p.stock>0?"":`<span class="clock">${esc(t("soldOut"))}</span>`}</div>
  <div class="cbody"><h3>${esc(pname(p))}</h3><div class="ko" lang="ko">${esc(p.name)}</div><div class="meta">${esc(region(p.region))}${p.form?" · "+esc(p.form==="건조"?t("dried"):p.form==="생물"?t("fresh"):p.form):""}</div>
  <div class="price num">${won(p.price)} <span class="approx">${esc(t("per")(unitT(p.unit)))} · ${esc(approx(p.price))}</span></div></div></button>`}
function renderMkt(){const ps=S.products.filter(p=>p.status==="판매중"&&!p.demo&&!(S.susp&&S.susp.has(p.sellerId))).filter(p=>S.mcat==="전체"||mcat(p.cat)===S.mcat).sort((a,b)=>(b.stock>0)-(a.stock>0)||(!!b.proofOk)-(!!a.proofOk)||b.createdAt-a.createdAt);
  $("#mlist").innerHTML=ps.length?ps.map(pcard).join(""):`<div class="empty">${esc(t("noMkt"))}</div>`}
function openP(id){const p=S.products.find(x=>x.id===id);if(!p)return;S.open=id;S.dlgKind="p";const d=$("#dlg"),sc_=((S.sellers||{})[p.sellerId]||{}).ship||{},ship=p.form==="생물"?(sc_.fresh!=null?+sc_.fresh:5000):(sc_.dry!=null?+sc_.dry:3500);let qty=1;
  const care=CARE[p.item],gv=t("growV")[p.grow];
  d.innerHTML=`<div class="dlg"><button class="x" type="button" aria-label="Close" id="dx">×</button>
   <div class="thumb">${p.photo?`<img src="${esc(p.photo)}" alt="${esc(pname(p))}">`:""}</div>
   <h2 style="font-size:24px">${esc(pname(p))}</h2><div class="ko" lang="ko">${esc(p.name)}</div>
   <div class="price num">${won(p.price)} <span class="approx">${esc(t("per")(unitT(p.unit)))} · ${esc(approx(p.price))}</span></div>
   ${care?`<div class="warn"><b>${esc(t("careT"))}:</b> ${esc(care[LI()])}</div>`:""}
   ${medNote(p.item,p.cat)}
   <div class="notice" style="background:var(--sunk);margin:0">${shipChip(p)} ${esc(t("shipInfo")[shipClass(p)])}</div>
   <dl>
    ${herbT(p.item)?`<dt>${esc(t("item"))}</dt><dd>${esc(herbT(p.item))}</dd>`:""}
    <dt>${esc(t("origin"))}</dt><dd>${esc(t("originV")(region(p.region)||"-"))} <span class="ko" lang="ko">(${esc(p.region)})</span></dd>
    ${p.form?`<dt>${esc(t("form"))}</dt><dd>${esc(p.form==="건조"?t("dried"):p.form==="생물"?t("fresh"):p.form)}</dd>`:""}
    ${gv?`<dt>${esc(t("growL"))}</dt><dd>${esc(gv)}</dd>`:""}
    ${p.proc?`<dt>${esc(t("ingr"))}</dt><dd lang="ko">${esc(p.proc.ingr)}</dd><dt>${esc(t("vol"))}</dt><dd>${esc(p.proc.vol)}</dd><dt>${esc(t("shelf"))}</dt><dd>${esc(p.proc.shelf)}</dd>`:""}
    <dt>${esc(t("ship"))}</dt><dd class="num">${won(ship)}</dd>
    <dt>${esc(t("seller"))}</dt><dd lang="ko">${esc((S.sellers[p.sellerId]||{}).shopName||"-")}</dd>
    ${p.desc?`<dt>${esc(t("desc"))}</dt><dd lang="ko" style="white-space:pre-wrap">${esc(p.desc)}</dd>`:""}
   </dl>
   ${p.stock>0&&p.sellerId!==S.uid?`<div style="display:grid;gap:10px;background:var(--sunk);border-radius:14px;padding:14px">
     <div class="qty"><span>${esc(t("qty"))}</span><button type="button" id="qm" aria-label="−">−</button><b class="num" id="qv">1</b><button type="button" id="qp" aria-label="+">+</button><span class="meta">× ${esc(unitT(p.unit))}</span></div>
     ${BETA()?"":`<fieldset class="field" style="border:0;padding:0;margin:0"><legend style="font-size:14px;margin-bottom:4px">${esc(t("dTitle"))}</legend>
       <label style="display:flex;gap:8px;align-items:center;min-height:36px"><input type="radio" name="dl" value="kr" checked> ${esc(t("dKr"))}</label>
       <label style="display:flex;gap:8px;align-items:center;min-height:36px;${shipClass(p)==="C"?"opacity:.5":""}"><input type="radio" name="dl" value="fwd" ${shipClass(p)==="C"?"disabled":""}> ${esc(t("dFwd"))}</label>
       ${shipClass(p)==="C"?`<span class="meta">${esc(t("dFwdNo"))}</span>`:""}</fieldset>
       <label class="field"><span id="memoL">${esc(t("memo"))}</span><input id="oMemo" maxlength="300" placeholder="${esc(t("memoPh"))}"></label>
       <label id="fwdOkL" hidden style="display:flex;gap:8px;align-items:flex-start;font-size:14px"><input type="checkbox" id="fwdOk" style="width:20px;height:20px;flex:none;margin-top:2px"> <span>${esc(t("fwdOk"))}</span></label>`}
     <button type="button" class="btn ${BETA()?"gold":"pri"}" id="buy"></button></div>`:p.stock>0?"":`<div class="notice">${esc(t("soldOut"))}</div>`}
  </div>`;
  $("#dx").onclick=()=>d.close();
  d.querySelectorAll('input[name="dl"]').forEach(r=>r.onchange=()=>{const f=r.value==="fwd"&&r.checked;$("#oMemo").placeholder=f?t("fwdPh"):t("memoPh");$("#fwdOkL").hidden=!f;$("#fwdOkL").style.display=f?"flex":"none"});
  if($("#fwdOkL"))$("#fwdOkL").style.display="none";
  const b=$("#buy");if(b){const upd=()=>{$("#qv").textContent=qty;b.textContent=BETA()?t("notifyMkt"):`${t("buy")} · ${t("total")} ${won(p.price*qty+ship)}`};upd();
    $("#qm").onclick=()=>{if(qty>1){qty--;upd()}};$("#qp").onclick=()=>{if(qty<p.stock){qty++;upd()}};
    b.onclick=async()=>{if(!S.uid){nmAuth.open(t("needLogin"));return}
      if(BETA()){await notifyKey(String(p.item||p.name).slice(0,30),"market");return}
      const dl=d.querySelector('input[name="dl"]:checked')?.value||"kr",memo=($("#oMemo")?.value||"").trim();
      if(dl==="fwd"&&shipClass(p)==="C")return;
      if(dl==="fwd"&&memo.length<3){toast(t("fwdNeed"));$("#oMemo").focus();return}
      if(dl==="fwd"&&!$("#fwdOk").checked){toast(t("fwdAgree"));return}
      b.disabled=true;
      try{const fresh=(await S.db.doc("products/"+p.id).get()).data();if(!fresh||fresh.stock<qty){toast(t("noStock"));return}
        await S.db.collection("orders").add({productId:p.id,productName:p.name,unit:p.unit,qty,unitPrice:p.price,ship,total:p.price*qty+ship,buyerId:S.uid,sellerId:p.sellerId,memo:memo.slice(0,300),delivery:dl,lang:window.NM_LANG,status:"결제완료",createdAt:Date.now()});
        await S.db.doc("products/"+p.id).update({stock:fresh.stock-qty});
        toast(t("ordered"));d.close();S.tab="ord";history.replaceState(null,"","#ord");paintStatic()}
      catch(e){e&&e.code==="login"?nmAuth.open(t("needLogin")):toast(t("fail"))}finally{b.disabled=false}}}
  if(!d.open)d.showModal()}
/* ---------- contact ---------- */
function openContact(){if(!S.uid){nmAuth.open(t("needLogin"));return}S.dlgKind="c";const d=$("#dlg");
  d.innerHTML=`<div class="dlg"><button class="x" type="button" aria-label="Close" id="dx">×</button><h2 style="font-size:22px">${esc(t("cTitle"))}</h2><p class="meta" style="margin:0">${esc(t("cLead"))} ${esc(t("cTr"))}</p>
   <textarea id="cText" rows="5" maxlength="1000" placeholder="${esc(t("cPh"))}" style="width:100%;border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--bg);font:inherit"></textarea>
   <div><button type="button" class="btn pri" id="cSend">${esc(t("cSend"))}</button></div></div>`;
  $("#dx").onclick=()=>d.close();
  $("#cSend").onclick=async()=>{const x=$("#cText").value.trim();if(x.length<5){toast(t("cShort"));return}
    if(/(\d[\s.\-]*){9,}/.test(x)){toast(t("cPh"));return}
    try{await S.db.collection("inquiries").add({by:S.uid,cat:"해외 손님",lang:window.NM_LANG,text:x.slice(0,1000),status:"접수",createdAt:Date.now()});toast(t("cOk"));d.close()}catch(e){e&&e.code==="login"?nmAuth.open(t("needLogin")):toast(t("fail"))}};
  if(!d.open)d.showModal()}
$("#contactBtn").onclick=openContact;
/* ---------- my orders ---------- */
function renderOrd(){const el=$("#olist");if(!S.uid){el.innerHTML=`<div class="empty">${esc(t("signToSee"))} <button type="button" class="btn sm pri" onclick="nmAuth.open()">${esc(t("signIn"))}</button></div>`;return}
  const os=S.orders.filter(o=>o.buyerId===S.uid).sort((a,b)=>b.createdAt-a.createdAt);
  const won_=S.auctions.map(a=>({a,x:auc(a)})).filter(o=>o.x.ended&&o.x.top&&o.x.top.bidderId===S.uid);
  const qs=(S.inq||[]).filter(x=>x.by===S.uid).sort((a,b)=>b.createdAt-a.createdAt);
  const qh=qs.length?`<h3 style="font-size:17px;margin:14px 0 0">${esc(t("myQ"))}</h3>`+qs.map(x=>`<div class="ord"><span class="meta">${day(x.createdAt)} · ${esc(x.reply?t("answer"):t("waiting"))}</span><span style="white-space:pre-wrap">${esc(x.text)}</span>${x.reply?`<div class="notice" style="margin:4px 0 0"><b>${esc(t("answer"))}</b><br><span style="white-space:pre-wrap">${esc(x.reply)}</span></div>`:""}</div>`).join(""):"";
  if(!os.length&&!won_.length){el.innerHTML=`<div class="empty">${esc(t("noOrd"))}</div>`+qh;return}
  el.innerHTML=won_.map(({a,x})=>`<div class="ord"><b>${esc(ftitle(a)||itemName(a))}</b><span class="ko" lang="ko">${esc(a.title)}</span><span class="num">${won(x.top.amount)} · ${esc(a.deal?(t("st")[a.deal]||a.deal):t("sold"))}</span></div>`).join("")+
   os.map(o=>{const p=S.products.find(x=>x.id===o.productId)||{item:"",name:o.productName};return `<div class="ord"><b>${esc(pname({...p,name:o.productName}))}</b><span class="ko" lang="ko">${esc(o.productName)}</span>
    <span class="num">${o.qty} × ${esc(unitT(o.unit))} · ${won(o.total)}</span><span class="meta">${esc(t("st")[o.status]||o.status)}${o.tracking?` · ${esc(t("track"))} ${esc(o.courier||"")} ${esc(o.tracking)}`:""}</span>
    ${o.status==="발송완료"?`<div><button type="button" class="btn sm pri" data-recv="${esc(o.id)}">${esc(t("recv"))}</button></div>`:""}</div>`}).join("")+qh;
  el.querySelectorAll("[data-recv]").forEach(b=>b.onclick=async()=>{b.disabled=true;try{await S.db.doc("orders/"+b.dataset.recv).update({status:"수령확인",receivedAt:Date.now()});toast(t("recvOk"))}catch(e){toast(t("fail"));b.disabled=false}})}
document.addEventListener("click",e=>{const c=e.target.closest("[data-aid]");if(c){openA(c.dataset.aid);return}const q=e.target.closest("[data-pid]");if(q)openP(q.dataset.pid)});
setInterval(()=>{render();if($("#dlg").open&&S.dlgKind==="a")paintBoard()},30000);
$("#dlg").onclick=e=>{if(e.target===$("#dlg"))$("#dlg").close()};

/* ---------- one auction ---------- */
let armed=null;
function openA(id){const a=S.auctions.find(x=>x.id===id);if(!a)return;S.open=id;S.dlgKind="a";armed=null;const d=$("#dlg");
  d.innerHTML=`<div class="dlg"><button class="x" type="button" aria-label="Close" id="dx">×</button>
   <div class="thumb">${a.photo?`<img src="${esc(a.photo)}" alt="${esc(itemName(a))}">`:""}</div>
   <div style="display:flex;gap:4px;flex-wrap:wrap">${chips(a)}</div>
   ${medNote(a.item||a.cat,"뿌리 약초")}
   <h2 style="font-size:24px">${esc(ftitle(a)||itemName(a))}</h2>
   <dl><dt>${esc(t("item"))}</dt><dd>${esc(itemName(a))}</dd></dl>
   <dl>
    <dt>${esc(t("grow"))}</dt><dd>${esc(String(a.grow||"").startsWith("자연산")?t("wildG"):t("farmG"))}</dd>
    ${a.weight?`<dt>${esc(t("weight"))}</dt><dd>${esc(weight(a.weight))} <span class="ko" lang="ko">(${esc(a.weight)})</span></dd>`:""}
    ${a.form?`<dt>${esc(t("form"))}</dt><dd>${esc(a.form==="건조"?t("dried"):t("fresh"))}</dd>`:""}
    <dt>${esc(t("region"))}</dt><dd>${esc(region(a.region))} <span class="ko" lang="ko">(${esc(a.region)})</span></dd>
    ${a.date?`<dt>${esc(t("dug"))}</dt><dd class="num">${esc(a.date)}</dd>`:""}
    ${permit(a.permit)?`<dt>${esc(t("basis"))}</dt><dd>${esc(permit(a.permit))}${a.proofOk?` · ✓ ${esc(t("proof"))}`:""}</dd>`:""}
    <dt>${esc(t("title"))}</dt><dd lang="ko">${esc(a.title)}</dd>
    ${a.desc?`<dt>${esc(t("desc"))}</dt><dd lang="ko" style="white-space:pre-wrap">${esc(a.desc)}</dd>`:""}
    <dt>${esc(t("seller"))}</dt><dd lang="ko">${esc((S.sellers[a.sellerId]||{}).shopName||"-")}</dd>
   </dl>
   <div id="board"></div></div>`;
  $("#dx").onclick=()=>d.close();
  if(!d.open)d.showModal();paintBoard()}
function paintBoard(){const a=S.auctions.find(x=>x.id===S.open);if(!a)return;const x=auc(a),open=a.status==="진행중"&&!x.ended,b=$("#board");if(!b)return;
  const hist=x.valid.slice().reverse().map(v=>`<div class="${v.bidderId===S.uid?"me":""}"><span>${esc(t("bidder"))} ${x.letters[v.bidderId]}${v.bidderId===S.uid?` (${esc(t("you"))})`:""}</span><span class="num">${won(v.amount)}</span></div>`).join("");
  const keep=b.querySelector("#bidIn")?.value;
  b.innerHTML=`<div style="display:grid;gap:8px;background:var(--sunk);border-radius:14px;padding:14px">
   <div class="meta">${esc(open?(x.top?t("live"):t("start")):(x.top?t("sold"):t("unsold")))} · ${esc(open?leftTxt(x.end-Date.now()):t("ended"))}</div>
   <div class="price num">${won(x.cur)} <span class="approx">${esc(approx(x.cur))}</span></div>
   ${a.buyNow&&open?`<div class="meta">${esc(t("buyNow")(won(a.buyNow)))} <span class="approx">${esc(approx(a.buyNow))}</span></div>`:""}
   ${open?(BETA()?`<button type="button" class="btn gold" id="notify">${esc(t("notify"))}</button>`:
     `<div class="meta">${esc(t("minBid")(won(x.minNext)))}${x.top&&x.top.bidderId===S.uid?" · "+esc(t("top")):""}</div>
      <div class="bidrow"><input id="bidIn" type="number" inputmode="numeric" min="${x.minNext}" step="${inc(x.cur)}" value="${esc(keep||x.minNext)}" aria-label="KRW"><button type="button" class="btn gold" id="bidBtn">${esc(t("bidBtn"))}</button></div>`):""}
   <div><b style="font-size:15px">${esc(t("history"))}</b><div class="hist">${hist||`<span class="meta">${esc(t("noBids"))}</span>`}</div></div></div>`;
  const nb=$("#notify");if(nb)nb.onclick=notify;
  const bb=$("#bidBtn");if(bb){const inp=$("#bidIn");inp.oninput=()=>{armed=null;bb.textContent=t("bidBtn")};bb.onclick=()=>bid(a.id)}}
async function notify(){const a=S.auctions.find(x=>x.id===S.open);await notifyKey(String(a.item||a.cat||"").slice(0,30),"auction")}
async function notifyKey(key,kind){if(!S.uid){nmAuth.open(t("needLogin"));return}
  if(S.alerts.some(x=>x.uid===S.uid&&x.key===key&&x.kind===kind)){toast(t("notified"));return}
  try{await S.db.collection("alerts").add({key,kind,uid:S.uid,beta:true,lang:window.NM_LANG,createdAt:Date.now()});S.alerts.push({uid:S.uid,key,kind});toast(t("notified"))}catch(e){e&&e.code==="login"?nmAuth.open(t("needLogin")):toast(t("fail"))}}
async function bid(id){if(!S.uid){nmAuth.open(t("needLogin"));return}
  const a=S.auctions.find(q=>q.id===id),x=auc(a),v=Math.round(+$("#bidIn").value),bb=$("#bidBtn");
  if(x.ended){toast(t("already"));return}
  if(!(v>=x.minNext)){toast(t("tooLow")(won(x.minNext)));return}
  if(armed!==v){armed=v;bb.textContent=t("confirm")(won(v));return}
  armed=null;bb.disabled=true;
  try{await S.db.collection("bids").add({auctionId:id,bidderId:S.uid,amount:v,t:Date.now(),lang:window.NM_LANG});toast(t("bidOk")(won(v)))}
  catch(e){e&&e.code==="login"?nmAuth.open(t("needLogin")):toast(t("fail"))}finally{bb.disabled=false}}

/* ---------- data ---------- */
(async()=>{
  paintStatic();
  const use=n=>Promise.resolve(window.claude?.use?.(n)??null).catch(()=>null);
  const user=await use("user"),db=await use("db");
  if(!db){$("#conn").hidden=false;$("#conn").textContent=t("conn");return}
  S.db=db;if(user){const me=await user.me();S.uid=me.id||null}paintWho();
  const sub=(c,f)=>db.collection(c).limit(1000).onSnapshot(s=>{f(s.docs.map(d=>({id:d.id,...d.data()})));render();if($("#dlg").open&&S.dlgKind==="a")paintBoard()},()=>{});
  sub("auctions",v=>S.auctions=v);
  sub("bids",v=>{S.bids=v;S.bidMap={};v.forEach(b=>(S.bidMap[b.auctionId]=S.bidMap[b.auctionId]||[]).push(b))});
  sub("sellers",v=>{S.sellers=Object.fromEntries(v.filter(x=>!x.id.startsWith("_")).map(x=>[x.id,x]))});
  sub("settings",v=>{S.site=(v.find(x=>x.id==="site")||{})});
  sub("products",v=>S.products=v);
  sub("sellerchecks",v=>{S.susp=new Set(v.filter(x=>x.suspended).map(x=>x.id))});
  if(S.uid){sub("alerts",v=>S.alerts=v);sub("orders",v=>S.orders=v);sub("inquiries",v=>S.inq=v)}
})();
</script>
</body>
</html>
