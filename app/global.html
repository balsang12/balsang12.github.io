const PERMITS={"국유림 임산물 채취 허가":["National-forest harvest permit","國有林採集許可","国有林采集许可"],"사유림 소유자 동의서":["Landowner’s written consent","私有林山主同意書","私有林山主同意书"],
 "본인 소유 임야·재배":["Seller’s own forest land","賣家自有林地","卖家自有林地"],"국유림 보호협약(마을 양여)":["Village forest-care agreement","國有林保護協約","国有林保护协约"],"산 임차 계약":["Forest lease contract","山林租賃契約","山林租赁合同"]};
const PROV=[["서울","Seoul","首爾","首尔"],["부산","Busan","釜山","釜山"],["대구","Daegu","大邱","大邱"],["인천","Incheon","仁川","仁川"],["광주","Gwangju","光州","光州"],["대전","Daejeon","大田","大田"],["울산","Ulsan","蔚山","蔚山"],["세종","Sejong","世宗","世宗"],
 ["경기","Gyeonggi","京畿","京畿"],["강원","Gangwon","江原","江原"],["충북","North Chungcheong","忠清北道","忠清北道"],["충남","South Chungcheong","忠清南道","忠清南道"],["전북","North Jeolla","全羅北道","全罗北道"],["전남","South Jeolla","全羅南道","全罗南道"],
 ["경북","North Gyeongsang","慶尚北道","庆尚北道"],["경남","South Gyeongsang","慶尚南道","庆尚南道"],["제주","Jeju","濟州","济州"],["충청북","North Chungcheong","忠清北道","忠清北道"],["충청남","South Chungcheong","忠清南道","忠清南道"],["전라북","North Jeolla","全羅北道","全罗北道"],["전라남","South Jeolla","全羅南道","全罗南道"],["경상북","North Gyeongsang","慶尚北道","庆尚北道"],["경상남","South Gyeongsang","慶尚南道","庆尚南道"]];
const FX_DEFAULT={USD:1400,HKD:180,TWD:44,CNY:195};
const LI=()=>({en:0,"zh-Hant":1,"zh-Hans":2}[window.NM_LANG]);
const t=k=>TX[window.NM_LANG][k];
const S={auctions:[],bids:[],bidMap:{},sellers:{},site:{},uid:null,db:null,filter:"all",alerts:[]};
const EXT=3*60*1000;
function inc(p){return p<100000?1000:p<1000000?5000:p<10000000?10000:50000}
const won=n=>"₩"+Math.round(n).toLocaleString("en-US");
function fxCode(){if(window.NM_LANG==="en")return "USD";if(window.NM_LANG==="zh-Hans")return "CNY";return /hk|mo/i.test(navigator.language||"")?"HKD":"TWD"}
function approx(n){const c=fxCode(),r=((S.site.fx||{})[c])||FX_DEFAULT[c],v=n/r;const sym={USD:"US$",HKD:"HK$",TWD:"NT$",CNY:"¥"}[c];
  return `${t("approx")} ${sym}${(v>=100?Math.round(v):Math.round(v*10)/10).toLocaleString("en-US")}`}
function itemName(a){const k=ITEMS[a.item]?a.item:ITEMS[a.cat]?a.cat:"기타 귀한 임산물";return ITEMS[k][LI()]}
function region(r){r=String(r||"");const p=PROV.find(x=>r.startsWith(x[0]));return p?p[1+LI()]:""}
function weight(w){return String(w||"").replace(/뿌리/g,window.NM_LANG==="en"?" root(s) ":"支 ").replace(/개/g,window.NM_LANG==="en"?" pcs ":"個 ").replace(/근/g,window.NM_LANG==="en"?" geun (600 g) ":"斤(600g) ").replace(/\s+/g," ").trim()}
function permit(p){return PERMITS[p]?PERMITS[p][LI()]:""}
/* same rules as the Korean app: bids are replayed in time order; a late bid extends the close by 3 minutes */
function auc(a){
  const raw=(S.bidMap[a.id]||[]).slice().sort((x,y)=>x.t-y.t||x.amount-y.amount);
  let end=a.endsAt||0;const valid=[];
  if(a.status==="진행중"){for(const b of raw){if(b.t>=end)break;const min=valid.length?valid[valid.length-1].amount+inc(valid[valid.length-1].amount):a.start;if(b.amount<min)continue;valid.push(b);
    if(a.buyNow&&b.amount>=a.buyNow){end=b.t;break}if(end-b.t<EXT)end=b.t+EXT}}
  const top=valid[valid.length-1]||null,ended=Date.now()>=end;
  const letters={};let n=0;valid.forEach(b=>{if(!(b.bidderId in letters))letters[b.bidderId]=String.fromCharCode(65+(n++%26))});
  return {valid,top,end,ended,cur:top?top.amount:a.start,minNext:top?top.amount+inc(top.amount):a.start,letters}}
function leftTxt(ms){ms=Math.max(0,ms);const d=Math.floor(ms/864e5),h=Math.floor(ms%864e5/36e5),m=Math.max(1,Math.floor(ms%36e5/6e4));return t("left")(d,h,m)}
function kind(a){const k=a.item||a.cat;return k==="산삼"?"wild":(k==="산양삼"||k==="장뇌삼")?"forest":"other"}
const BETA=()=>(S.site||{}).beta!==false;
let toastT=0;function toast(m){const e=$("#toast");e.textContent=m;e.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>e.hidden=true,3500)}

/* ---------- static text ---------- */
function paintStatic(){
  document.documentElement.lang=window.NM_LANG==="en"?"en":window.NM_LANG;
  document.title=window.NM_LANG==="en"?"Korean Wild Ginseng Auction · Nongmani":t("tag")+" · 農마니";
  $("#tagline").textContent=t("tag");$("#h1").textContent=t("h1");$("#lead").textContent=t("lead");
  $("#steps").innerHTML=t("steps").map(([b,s])=>`<li><b>${esc(b)}</b><span>${esc(s)}</span></li>`).join("");
  $("#foot").innerHTML=t("foot")+"<br>"+esc(t("note"))+" "+esc(t("law"));
  document.querySelectorAll("[data-lang]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.lang===window.NM_LANG));
  $("#filters").innerHTML=["all","wild","forest","other"].map(k=>`<button type="button" class="filter" data-f="${k}" aria-pressed="${S.filter===k}">${esc(t(k))}</button>`).join("");
  paintWho();render()}
function paintWho(){$("#who").innerHTML=S.uid?`<button type="button" class="btn sm" id="out">${esc(t("signOut"))}</button>`:`<button type="button" class="btn sm pri" id="in">${esc(t("signIn"))}</button>`;
  $("#in")&&($("#in").onclick=()=>nmAuth.open(t("needLogin")));$("#out")&&($("#out").onclick=()=>nmAuth.signOut())}
document.querySelectorAll("[data-lang]").forEach(b=>b.onclick=()=>{window.NM_LANG=b.dataset.lang;try{localStorage.setItem("nm_lang",window.NM_LANG)}catch(e){}
  const u=new URL(location.href);u.searchParams.set("lang",window.NM_LANG);history.replaceState(null,"",u);paintStatic();if($("#dlg").open)openA(S.open)});
$("#filters").onclick=e=>{const b=e.target.closest("[data-f]");if(!b)return;S.filter=b.dataset.f;paintStatic()};

/* ---------- list ---------- */
function chips(a){return [a.proofOk?`<span class="chip solid">✓ ${esc(t("proof"))}</span>`:"",String(a.grow||"").startsWith("자연산")?`<span class="chip">${esc(t("wildChip"))}</span>`:`<span class="chip">${esc(kind(a)==="forest"?t("farmChip"):t("farmG"))}</span>`,a.cert?`<span class="chip gold">${esc(t("certChip"))}</span>`:"",a.appraise?`<span class="chip gold">${esc(t("apprChip"))}</span>`:""].join("")}
function card(a){const x=auc(a),open=a.status==="진행중"&&!x.ended;
  return `<button type="button" class="card" data-aid="${esc(a.id)}"><div class="thumb">${a.photo?`<img src="${esc(a.photo)}" alt="${esc(itemName(a))}" loading="lazy">`:""}<div class="tl">${chips(a)}</div><span class="clock">${open?esc(leftTxt(x.end-Date.now())):esc(t("ended"))}</span></div>
   <div class="cbody"><h3>${esc(itemName(a))}</h3><div class="ko" lang="ko">${esc(a.title)}</div>
   <div class="meta">${[region(a.region),weight(a.weight)].filter(Boolean).map(esc).join(" · ")}</div>
   <div><span class="meta">${esc(open?(x.top?t("live"):t("start")):(x.top?t("sold"):t("unsold")))}</span><div class="price num">${won(x.cur)} <span class="approx">${esc(approx(x.cur))}</span></div></div>
   <div class="meta">${esc(t("bids")(x.valid.length))}</div></div></button>`}
function render(){
  const live=S.auctions.filter(a=>a.status==="진행중"&&!a.demo).filter(a=>S.filter==="all"||kind(a)===S.filter);
  const open=live.filter(a=>!auc(a).ended).sort((a,b)=>(!!b.proofOk)-(!!a.proofOk)||auc(a).end-auc(b).end);
  const done=live.filter(a=>auc(a).ended&&Date.now()-auc(a).end<14*864e5).sort((a,b)=>auc(b).end-auc(a).end).slice(0,8);
  $("#list").innerHTML=open.length?open.map(card).join(""):`<div class="empty">${esc(t("none"))}</div>`;
  $("#hDone").hidden=!done.length;$("#hDone").textContent=t("closed");$("#done").innerHTML=done.map(card).join("");
  $("#beta").hidden=!BETA();$("#beta").textContent=t("beta")}
document.addEventListener("click",e=>{const c=e.target.closest("[data-aid]");if(c)openA(c.dataset.aid)});
setInterval(()=>{render();if($("#dlg").open)paintBoard()},30000);
$("#dlg").onclick=e=>{if(e.target===$("#dlg"))$("#dlg").close()};

/* ---------- one auction ---------- */
let armed=null;
function openA(id){const a=S.auctions.find(x=>x.id===id);if(!a)return;S.open=id;armed=null;const d=$("#dlg");
  d.innerHTML=`<div class="dlg"><button class="x" type="button" aria-label="Close" id="dx">×</button>
   <div class="thumb">${a.photo?`<img src="${esc(a.photo)}" alt="${esc(itemName(a))}">`:""}</div>
   <div style="display:flex;gap:4px;flex-wrap:wrap">${chips(a)}</div>
   <h2 style="font-size:24px">${esc(itemName(a))}</h2>
   <dl>
    <dt>${esc(t("grow"))}</dt><dd>${esc(String(a.grow||"").startsWith("자연산")?t("wildG"):t("farmG"))}</dd>
    ${a.weight?`<dt>${esc(t("weight"))}</dt><dd>${esc(weight(a.weight))} <span class="ko" lang="ko">(${esc(a.weight)})</span></dd>`:""}
    ${a.form?`<dt>${esc(t("form"))}</dt><dd>${esc(a.form==="건조"?t("dried"):t("fresh"))}</dd>`:""}
    <dt>${esc(t("region"))}</dt><dd>${esc(region(a.region))} <span class="ko" lang="ko">(${esc(a.region)})</span></dd>
    ${a.date?`<dt>${esc(t("dug"))}</dt><dd class="num">${esc(a.date)}</dd>`:""}
    ${permit(a.permit)?`<dt>${esc(t("basis"))}</dt><dd>${esc(permit(a.permit))}${a.proofOk?` · ✓ ${esc(t("proof"))}`:""}</dd>`:""}
    <dt>${esc(t("title"))}</dt><dd lang="ko">${esc(a.title)}</dd>
    ${a.desc?`<dt>${esc(t("desc"))}</dt><dd lang="ko" style="white-space:pre-wrap">${esc(a.desc)}</dd>`:""}
    <dt>${esc(t("seller"))}</dt><dd lang="ko">${esc((S.sellers[a.sellerId]||{}).shopName||"-")}</dd>
   </dl>
   <div id="board"></div></div>`;
  $("#dx").onclick=()=>d.close();
  if(!d.open)d.showModal();paintBoard()}
function paintBoard(){const a=S.auctions.find(x=>x.id===S.open);if(!a)return;const x=auc(a),open=a.status==="진행중"&&!x.ended,b=$("#board");if(!b)return;
  const hist=x.valid.slice().reverse().map(v=>`<div class="${v.bidderId===S.uid?"me":""}"><span>${esc(t("bidder"))} ${x.letters[v.bidderId]}${v.bidderId===S.uid?` (${esc(t("you"))})`:""}</span><span class="num">${won(v.amount)}</span></div>`).join("");
  const keep=b.querySelector("#bidIn")?.value;
  b.innerHTML=`<div style="display:grid;gap:8px;background:var(--sunk);border-radius:14px;padding:14px">
   <div class="meta">${esc(open?(x.top?t("live"):t("start")):(x.top?t("sold"):t("unsold")))} · ${esc(open?leftTxt(x.end-Date.now()):t("ended"))}</div>
   <div class="price num">${won(x.cur)} <span class="approx">${esc(approx(x.cur))}</span></div>
   ${a.buyNow&&open?`<div class="meta">${esc(t("buyNow")(won(a.buyNow)))} <span class="approx">${esc(approx(a.buyNow))}</span></div>`:""}
   ${open?(BETA()?`<button type="button" class="btn gold" id="notify">${esc(t("notify"))}</button>`:
     `<div class="meta">${esc(t("minBid")(won(x.minNext)))}${x.top&&x.top.bidderId===S.uid?" · "+esc(t("top")):""}</div>
      <div class="bidrow"><input id="bidIn" type="number" inputmode="numeric" min="${x.minNext}" step="${inc(x.cur)}" value="${esc(keep||x.minNext)}" aria-label="KRW"><button type="button" class="btn gold" id="bidBtn">${esc(t("bidBtn"))}</button></div>`):""}
   <div><b style="font-size:15px">${esc(t("history"))}</b><div class="hist">${hist||`<span class="meta">${esc(t("noBids"))}</span>`}</div></div></div>`;
  const nb=$("#notify");if(nb)nb.onclick=notify;
  const bb=$("#bidBtn");if(bb){const inp=$("#bidIn");inp.oninput=()=>{armed=null;bb.textContent=t("bidBtn")};bb.onclick=()=>bid(a.id)}}
async function notify(){if(!S.uid){nmAuth.open(t("needLogin"));return}const a=S.auctions.find(x=>x.id===S.open);const key=String(a.item||a.cat||"").slice(0,30);
  if(S.alerts.some(x=>x.uid===S.uid&&x.key===key&&x.kind==="auction")){toast(t("notified"));return}
  try{await S.db.collection("alerts").add({key,kind:"auction",uid:S.uid,beta:true,lang:window.NM_LANG,createdAt:Date.now()});S.alerts.push({uid:S.uid,key,kind:"auction"});toast(t("notified"))}catch(e){e&&e.code==="login"?nmAuth.open(t("needLogin")):toast(t("fail"))}}
async function bid(id){if(!S.uid){nmAuth.open(t("needLogin"));return}
  const a=S.auctions.find(q=>q.id===id),x=auc(a),v=Math.round(+$("#bidIn").value),bb=$("#bidBtn");
  if(x.ended){toast(t("already"));return}
  if(!(v>=x.minNext)){toast(t("tooLow")(won(x.minNext)));return}
  if(armed!==v){armed=v;bb.textContent=t("confirm")(won(v));return}
  armed=null;bb.disabled=true;
  try{await S.db.collection("bids").add({auctionId:id,bidderId:S.uid,amount:v,t:Date.now(),lang:window.NM_LANG});toast(t("bidOk")(won(v)))}
  catch(e){e&&e.code==="login"?nmAuth.open(t("needLogin")):toast(t("fail"))}finally{bb.disabled=false}}

/* ---------- data ---------- */
(async()=>{
  paintStatic();
  const use=n=>Promise.resolve(window.claude?.use?.(n)??null).catch(()=>null);
  const user=await use("user"),db=await use("db");
  if(!db){$("#conn").hidden=false;$("#conn").textContent=t("conn");return}
  S.db=db;if(user){const me=await user.me();S.uid=me.id||null}paintWho();
  const sub=(c,f)=>db.collection(c).limit(1000).onSnapshot(s=>{f(s.docs.map(d=>({id:d.id,...d.data()})));render();if($("#dlg").open)paintBoard()},()=>{});
  sub("auctions",v=>S.auctions=v);
  sub("bids",v=>{S.bids=v;S.bidMap={};v.forEach(b=>(S.bidMap[b.auctionId]=S.bidMap[b.auctionId]||[]).push(b))});
  sub("sellers",v=>{S.sellers=Object.fromEntries(v.filter(x=>!x.id.startsWith("_")).map(x=>[x.id,x]))});
  sub("settings",v=>{S.site=(v.find(x=>x.id==="site")||{})});
  if(S.uid)sub("alerts",v=>S.alerts=v);
})();
</script>
</body>
</html>
