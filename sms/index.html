function filled(t){let s=t;KEYS.forEach(k=>{const v=$("#f_"+k).value.trim();if(v)s=s.split("["+k+"]").join(v)});
  if($("#adOn").checked)s="(광고) "+s+"\n무료수신거부 010-8167-8040 (‘거부’라고 문자 주세요)";return s}
function show(t){return esc(t).replace(/\[(이름|품목|양|날짜|금액|단체명|명절|제철 품목)\]/g,'<mark>[$1]</mark>').replace(/https:\/\/[^\s<]+/g,u=>`<a href="${u}" target="_blank" rel="noopener">${u}</a>`)}
function render(){
  $("#tabs").innerHTML=CATS.map(c=>`<button type="button" role="tab" aria-pressed="${c===cat}" data-c="${c}">${c}</button>`).join("");
  $("#list").innerHTML=T.map((t,i)=>[t,i]).filter(([t])=>cat==="전체"||t[0]===cat).map(([t,i])=>{const s=filled(t[2]);
    return `<div class="card" id="c${i}"><h2>${i+1}. ${esc(t[1])} <span>· ${esc(t[0])}</span></h2><div class="txt">${show(s)}</div>
    <button class="more" type="button" data-more="${i}">전체 보기 ▾</button>
    <div class="btns"><button class="copy" type="button" data-copy="${i}">복사하기</button><a class="send" href="sms:?body=${encodeURIComponent(s)}">문자 앱으로</a></div></div>`}).join("")}
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove("on"),1800)}
async function copy(s){try{await navigator.clipboard.writeText(s);return true}catch(e){const a=document.createElement("textarea");a.value=s;a.style.position="fixed";a.style.opacity="0";document.body.appendChild(a);a.select();let ok=false;try{ok=document.execCommand("copy")}catch(_){}a.remove();return ok}}
document.addEventListener("click",async e=>{const c=e.target.closest("[data-c]");if(c){cat=c.dataset.c;render();return}
  const m=e.target.closest("[data-more]");if(m){const card=$("#c"+m.dataset.more);card.classList.toggle("open");m.textContent=card.classList.contains("open")?"접기 ▴":"전체 보기 ▾";return}
  const b=e.target.closest("[data-copy]");if(b){const s=filled(T[+b.dataset.copy][2]);if(/\[(이름|품목|양|날짜|금액|단체명|명절|제철 품목)\]/.test(s))toast("복사했어요. [ ] 칸을 꼭 바꿔 주세요");else toast("복사했어요. 문자에 붙여 넣으세요");await copy(s)}});
KEYS.forEach(k=>{const i=$("#f_"+k);try{i.value=localStorage.getItem("sms_"+k)||""}catch(e){}i.addEventListener("input",()=>{try{localStorage.setItem("sms_"+k,i.value)}catch(e){}render()})});
$("#adOn").addEventListener("change",render);render();
</script>
</body></html>
